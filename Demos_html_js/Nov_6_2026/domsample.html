<html>
<head>
<script src="myscript.js"></script>
style
{
font-color:red;
}
<script language ="JavaScript">
function addNode()
{
var myDate = new Date();
var myDateStr = myDate.toLocaleString();

var myNode = document.createTextNode(myDateStr);
var mySpan = document.getElementById('span1');
mySpan.removeChild(mySpan.firstChild);
mySpan.appendChild(myNode);
}
</script>
</head>
<body >
<center>
<h2>We are Understanding DOM</h2>
<span id="span1">
	Get Date Here
</span></br>
<button id="button1" onClick="addNode()">GetDate</button>
<p style="font-color:red">Paragraph1</p>
</center>
</body>
</html>
